<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#1F73D9"/>
    </linearGradient>
    <linearGradient id="gSuccess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BD980"/>
      <stop offset="100%" stop-color="#258F44"/>
    </linearGradient>
    <linearGradient id="gDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="100%" stop-color="#D63232"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="goldTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3A0"/>
      <stop offset="55%" stop-color="#FFD933"/>
      <stop offset="100%" stop-color="#C9990A"/>
    </linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252B45"/>
      <stop offset="100%" stop-color="#181D30"/>
    </linearGradient>
    <linearGradient id="gBgVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/>
      <stop offset="55%" stop-color="#0F1A38"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowDeep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="overlay" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1A2552" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0A0E1C" stop-opacity="0.96"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#gBgVert)"/>
  <rect width="1920" height="1080" fill="rgba(0,0,0,0.65)"/>

  <g fill="#FFD933" opacity="0.6">
    <polygon points="320,180 328,200 348,208 328,216 320,236 312,216 292,208 312,200"/>
    <polygon points="1600,220 1606,234 1620,240 1606,246 1600,260 1594,246 1580,240 1594,234"/>
    <circle cx="480" cy="320" r="4"/>
    <circle cx="1440" cy="300" r="5"/>
  </g>

  <g transform="translate(560,190)" filter="url(#shadowDeep)">
    <rect width="800" height="700" rx="32" fill="url(#gPanel)" stroke="rgba(255,217,51,0.35)" stroke-width="3"/>
    <rect x="2" y="2" width="796" height="6" rx="3" fill="#FFD933"/>

    <g transform="translate(400,100)" text-anchor="middle" filter="url(#glow)">
      <text font-size="72" font-weight="900" fill="url(#goldTitle)" letter-spacing="8">LEVEL UP!</text>
    </g>

    <text x="400" y="290" text-anchor="middle" font-size="160" font-weight="900" fill="#FFFFFF">13</text>
    <text x="400" y="330" text-anchor="middle" font-size="24" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="6">NEW LEVEL REACHED</text>

    <text x="80" y="400" font-size="22" font-weight="700" fill="#FFD933" letter-spacing="4">UNLOCKED</text>
    <g transform="translate(80,430)" fill="rgba(255,255,255,0.85)">
      <text y="0" font-size="26" font-weight="600">- Castle Arena theme</text>
      <text y="44" font-size="26" font-weight="600">- Daily quests available</text>
    </g>

    <g transform="translate(400,560)" text-anchor="middle">
      <rect x="-180" y="-28" width="360" height="56" rx="28" fill="rgba(255,217,51,0.12)" stroke="rgba(255,217,51,0.35)" stroke-width="2"/>
      <circle cx="-120" cy="0" r="14" fill="#FFD933"/>
      <text x="-90" y="10" font-size="28" font-weight="800" fill="#FFD933">+650 COINS</text>
    </g>

    <g transform="translate(120,610)" filter="url(#shadowSoft)">
      <rect width="560" height="80" rx="40" fill="url(#gPrimary)"/>
      <rect x="8" y="8" width="544" height="20" rx="10" fill="#FFFFFF" opacity="0.15"/>
      <text x="280" y="52" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="4">CONTINUE</text>
    </g>
  </g>

  <text x="40" y="40" font-size="14" fill="rgba(255,255,255,0.45)">11 - LEVEL UP MODAL - 1920x1080</text>
</svg>

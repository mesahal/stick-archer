<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#1F73D9"/>
    </linearGradient>
    <linearGradient id="gSuccess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BD980"/>
      <stop offset="100%" stop-color="#258F44"/>
    </linearGradient>
    <linearGradient id="gDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="100%" stop-color="#D63232"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="goldTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3A0"/>
      <stop offset="55%" stop-color="#FFD933"/>
      <stop offset="100%" stop-color="#C9990A"/>
    </linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252B45"/>
      <stop offset="100%" stop-color="#181D30"/>
    </linearGradient>
    <linearGradient id="gBgVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/>
      <stop offset="55%" stop-color="#0F1A38"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowDeep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgDefeat" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A1A28"/>
      <stop offset="60%" stop-color="#1A0E1C"/>
      <stop offset="100%" stop-color="#0A060C"/>
    </radialGradient>
    <linearGradient id="dimSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E2EA"/>
      <stop offset="55%" stop-color="#A8A8B5"/>
      <stop offset="100%" stop-color="#5A5A6A"/>
    </linearGradient>
    <linearGradient id="cardLose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1E2E"/><stop offset="100%" stop-color="#16101B"/>
    </linearGradient>
    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="desat">
      <feColorMatrix type="matrix" values="0.5 0.5 0.5 0 0  0.4 0.4 0.4 0 0  0.4 0.4 0.4 0 0  0 0 0 1 0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgDefeat)"/>

  <!-- Subtle "rain" lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="200" y1="-20" x2="180" y2="200"/>
    <line x1="420" y1="-20" x2="400" y2="200"/>
    <line x1="640" y1="-20" x2="620" y2="200"/>
    <line x1="860" y1="-20" x2="840" y2="200"/>
    <line x1="1080" y1="-20" x2="1060" y2="200"/>
    <line x1="1300" y1="-20" x2="1280" y2="200"/>
    <line x1="1520" y1="-20" x2="1500" y2="200"/>
    <line x1="1740" y1="-20" x2="1720" y2="200"/>
  </g>

  <!-- Broken arrow ornament -->
  <g transform="translate(960,180)" opacity="0.5">
    <line x1="-110" y1="0" x2="-30" y2="0" stroke="#A8A8B5" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="110" y2="0" stroke="#A8A8B5" stroke-width="6" stroke-linecap="round"/>
    <polygon points="110,0 96,-8 96,8" fill="#A8A8B5"/>
    <!-- crack -->
    <line x1="-30" y1="-10" x2="-20" y2="0" stroke="#A8A8B5" stroke-width="2"/>
    <line x1="-20" y1="0" x2="-30" y2="10" stroke="#A8A8B5" stroke-width="2"/>
    <line x1="30" y1="-10" x2="20" y2="0" stroke="#A8A8B5" stroke-width="2"/>
    <line x1="20" y1="0" x2="30" y2="10" stroke="#A8A8B5" stroke-width="2"/>
  </g>

  <!-- ===== DEFEAT TITLE ===== -->
  <g transform="translate(960,320)" text-anchor="middle" filter="url(#titleShadow)">
    <text font-size="200" font-weight="900" fill="url(#dimSilver)" stroke="#1A0E1C" stroke-width="6" letter-spacing="14">DEFEAT</text>
  </g>

  <!-- ===== FINAL SCORE CARD ===== -->
  <g transform="translate(440,500)" filter="url(#shadowDeep)">
    <rect width="1040" height="260" rx="32" fill="url(#cardLose)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <text x="520" y="96" text-anchor="middle" font-size="26" font-weight="700" fill="rgba(255,255,255,0.6)" letter-spacing="10">FINAL SCORE</text>
    <text x="520" y="206" text-anchor="middle" font-size="110" font-weight="900" fill="rgba(255,255,255,0.7)">2 <tspan fill="rgba(255,255,255,0.3)">—</tspan> <tspan fill="#F23F3F">5</tspan></text>
  </g>

  <!-- ===== REWARDS STRIP (participation rewards on defeat) ===== -->
  <g transform="translate(440,790)" filter="url(#shadowDeep)">
    <rect width="1040" height="88" rx="20" fill="rgba(26,31,51,0.45)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="320" cy="44" r="16" fill="#FFD933" opacity="0.85"/>
    <text x="350" y="40" font-size="22" font-weight="800" fill="rgba(255,217,51,0.9)">+10</text>
    <text x="350" y="62" font-size="16" font-weight="700" fill="rgba(255,255,255,0.45)" letter-spacing="3">COINS</text>
    <g transform="translate(680,44)" stroke="rgba(255,255,255,0.7)" stroke-width="4" fill="none" stroke-linecap="round">
      <polyline points="-14,-1 0,-15 14,-1"/>
      <polyline points="-14,15 0,1 14,15"/>
    </g>
    <text x="710" y="40" font-size="22" font-weight="800" fill="rgba(255,255,255,0.75)">+20</text>
    <text x="710" y="62" font-size="16" font-weight="700" fill="rgba(255,255,255,0.45)" letter-spacing="3">XP</text>
  </g>

  <!-- ===== ACTION BUTTONS ===== -->
  <g transform="translate(440,920)" filter="url(#shadowDeep)">
    <rect width="500" height="120" rx="60" fill="url(#gPrimary)"/>
    <text x="250" y="78" text-anchor="middle" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="3">REMATCH</text>
  </g>

  <g transform="translate(980,920)">
    <rect width="500" height="120" rx="60" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="3"/>
    <text x="250" y="78" text-anchor="middle" font-size="32" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="3">MAIN MENU</text>
  </g>

  <text x="40" y="40" font-size="14" fill="rgba(255,255,255,0.45)">09 — RESULTS · DEFEAT · 1920×1080</text>
</svg>

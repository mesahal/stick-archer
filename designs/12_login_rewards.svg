<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#1F73D9"/>
    </linearGradient>
    <linearGradient id="gSuccess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BD980"/>
      <stop offset="100%" stop-color="#258F44"/>
    </linearGradient>
    <linearGradient id="gDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="100%" stop-color="#D63232"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="goldTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3A0"/>
      <stop offset="55%" stop-color="#FFD933"/>
      <stop offset="100%" stop-color="#C9990A"/>
    </linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252B45"/>
      <stop offset="100%" stop-color="#181D30"/>
    </linearGradient>
    <linearGradient id="gBgVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/>
      <stop offset="55%" stop-color="#0F1A38"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowDeep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="overlay" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1A2552" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0A0E1C" stop-opacity="0.94"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3258"/>
      <stop offset="100%" stop-color="#161B30"/>
    </linearGradient>
    <linearGradient id="chestGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6A800"/>
    </linearGradient>
    <linearGradient id="chestPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BA8FF"/>
      <stop offset="100%" stop-color="#4A6BE6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#gBgVert)"/>
  <rect width="1920" height="1080" fill="rgba(0,0,0,0.65)"/>

  <g transform="translate(560,240)" filter="url(#shadowDeep)">
    <rect width="800" height="600" rx="32" fill="url(#gPanel)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <rect x="2" y="2" width="796" height="6" rx="3" fill="#FFD933"/>
    <text x="400" y="72" text-anchor="middle" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="4">DAILY REWARDS</text>
    <text x="400" y="110" text-anchor="middle" font-size="22" font-weight="500" fill="rgba(255,255,255,0.55)">Claim free coins and gems</text>

    <g transform="translate(80,160)" filter="url(#shadowSoft)">
      <rect width="300" height="320" rx="24" fill="url(#gPanel)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
      <text x="150" y="48" text-anchor="middle" font-size="22" font-weight="800" fill="rgba(255,255,255,0.7)" letter-spacing="3">HOURLY</text>
      <g transform="translate(150,150)">
        <rect x="-70" y="-20" width="140" height="90" rx="12" fill="url(#chestGold)"/>
        <rect x="-70" y="-50" width="140" height="40" rx="10" fill="#FFD933"/>
        <rect x="-12" y="-36" width="24" height="24" rx="4" fill="#C9990A"/>
      </g>
      <circle cx="80" cy="250" r="12" fill="#FFD933"/>
      <text x="104" y="256" font-size="24" font-weight="800" fill="#FFD933">+100</text>
      <g transform="translate(150,290)" filter="url(#shadowSoft)">
        <rect x="-110" y="-24" width="220" height="48" rx="24" fill="url(#gSuccess)"/>
        <rect x="-102" y="-16" width="204" height="12" rx="6" fill="#FFFFFF" opacity="0.15"/>
        <text x="0" y="8" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">CLAIM</text>
      </g>
    </g>

    <g transform="translate(420,160)" filter="url(#shadowSoft)">
      <rect width="300" height="320" rx="24" fill="url(#gPanel)" stroke="rgba(107,140,255,0.35)" stroke-width="2"/>
      <text x="150" y="48" text-anchor="middle" font-size="22" font-weight="800" fill="#6B8CFF" letter-spacing="3">12 HOUR</text>
      <g transform="translate(150,150)">
        <rect x="-80" y="-24" width="160" height="96" rx="14" fill="url(#chestPurple)"/>
        <rect x="-80" y="-58" width="160" height="44" rx="12" fill="#6B8CFF"/>
        <rect x="-14" y="-42" width="28" height="28" rx="5" fill="#4A6BE6"/>
      </g>
      <circle cx="70" cy="238" r="12" fill="#FFD933"/>
      <text x="94" y="244" font-size="22" font-weight="800" fill="#FFD933">+600</text>
      <polygon points="190,232 204,244 196,260 184,260 176,244" fill="#6B8CFF"/>
      <text x="214" y="244" font-size="22" font-weight="800" fill="#6B8CFF">+5</text>
      <g transform="translate(150,290)">
        <rect x="-110" y="-24" width="220" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
        <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="rgba(255,255,255,0.85)">WATCH AD</text>
      </g>
      <text x="150" y="340" text-anchor="middle" font-size="16" fill="rgba(255,255,255,0.4)">Available in 4h 12m</text>
    </g>

    <g transform="translate(720,24)">
      <circle cx="0" cy="0" r="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <text x="40" y="40" font-size="14" fill="rgba(255,255,255,0.45)">12 - LOGIN REWARDS - 1920x1080</text>
</svg>

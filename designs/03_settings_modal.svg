<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#1F73D9"/>
    </linearGradient>
    <linearGradient id="gSuccess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BD980"/>
      <stop offset="100%" stop-color="#258F44"/>
    </linearGradient>
    <linearGradient id="gDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="100%" stop-color="#D63232"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="goldTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3A0"/>
      <stop offset="55%" stop-color="#FFD933"/>
      <stop offset="100%" stop-color="#C9990A"/>
    </linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252B45"/>
      <stop offset="100%" stop-color="#181D30"/>
    </linearGradient>
    <linearGradient id="gBgVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/>
      <stop offset="55%" stop-color="#0F1A38"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowDeep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/><stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
  </defs>

  <!-- Dimmed background showing menu beneath -->
  <rect width="1920" height="1080" fill="url(#bgSky)"/>
  <g opacity="0.25">
    <text x="960" y="320" text-anchor="middle" font-size="160" font-weight="900" fill="#FFD933" letter-spacing="8">STICK ARCHER</text>
    <rect x="440" y="500" width="640" height="140" rx="70" fill="#268CF2"/>
    <rect x="440" y="680" width="640" height="140" rx="70" fill="#33B859"/>
  </g>

  <!-- Dim overlay -->
  <rect width="1920" height="1080" fill="rgba(0,0,0,0.65)"/>

  <!-- ==== MODAL ==== -->
  <g transform="translate(560,280)" filter="url(#shadowDeep)">
    <rect width="800" height="440" rx="32" fill="url(#gPanel)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <!-- Header -->
    <rect width="800" height="100" rx="32" fill="#0F1421"/>
    <rect y="80" width="800" height="20" fill="#0F1421"/>
    <text x="40" y="64" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="3">SETTINGS</text>
    <!-- Close icon -->
    <g transform="translate(744,50)">
      <circle r="32" fill="rgba(255,255,255,0.08)"/>
      <path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
    <line x1="0" y1="100" x2="800" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- ==== AUDIO SECTION (icon left edge aligns with slider track at x=60) ==== -->
    <g transform="translate(60,128)">
      <rect y="0" width="32" height="32" rx="6" fill="#FFD933" opacity="0.15"/>
      <g transform="translate(16,16)">
        <path d="M-8 -6 L-2 -6 L4 -12 L4 12 L-2 6 L-8 6 Z" fill="#FFD933"/>
        <path d="M6 -4 Q10 0 6 4" fill="none" stroke="#FFD933" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="44" y="23" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="3">AUDIO</text>
    </g>

    <!-- SFX slider -->
    <g transform="translate(60,180)">
      <text y="22" font-size="22" font-weight="500" fill="rgba(255,255,255,0.85)">Sound Effects</text>
      <text x="660" y="22" text-anchor="end" font-size="22" font-weight="700" fill="#FFD933">80</text>
      <g transform="translate(0,32)">
        <rect width="660" height="20" rx="10" fill="#0F1421"/>
        <rect width="528" height="20" rx="10" fill="url(#gPrimary)"/>
        <circle cx="528" cy="10" r="20" fill="#FFFFFF" filter="url(#shadowSoft)"/>
      </g>
    </g>

    <!-- ==== CONTROLS SECTION (icon aligned with content column at x=60) ==== -->
    <g transform="translate(60,280)">
      <rect y="0" width="32" height="32" rx="6" fill="#268CF2" opacity="0.15"/>
      <g transform="translate(16,16)">
        <circle r="9" fill="none" stroke="#268CF2" stroke-width="2"/>
        <ellipse rx="9" ry="4" fill="none" stroke="#268CF2" stroke-width="2"/>
        <line x1="-9" y1="0" x2="9" y2="0" stroke="#268CF2" stroke-width="2"/>
      </g>
      <text x="44" y="23" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="3">CONTROLS</text>
    </g>

    <!-- Vibration toggle (on) -->
    <g transform="translate(60,332)">
      <text y="22" font-size="22" font-weight="500" fill="rgba(255,255,255,0.85)">Vibration</text>
      <text y="46" font-size="16" fill="rgba(255,255,255,0.45)">Haptic feedback on hits and UI taps</text>
      <g transform="translate(596,12)">
        <rect width="72" height="36" rx="18" fill="url(#gSuccess)"/>
        <circle cx="54" cy="18" r="14" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <text x="40" y="40" font-size="14" fill="rgba(255,255,255,0.25)">03 — SETTINGS MODAL · over Main Menu · 1920×1080</text>
</svg>

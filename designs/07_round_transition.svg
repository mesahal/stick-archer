<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#1F73D9"/>
    </linearGradient>
    <linearGradient id="gSuccess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BD980"/>
      <stop offset="100%" stop-color="#258F44"/>
    </linearGradient>
    <linearGradient id="gDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="100%" stop-color="#D63232"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="goldTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3A0"/>
      <stop offset="55%" stop-color="#FFD933"/>
      <stop offset="100%" stop-color="#C9990A"/>
    </linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252B45"/>
      <stop offset="100%" stop-color="#181D30"/>
    </linearGradient>
    <linearGradient id="gBgVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/>
      <stop offset="55%" stop-color="#0F1A38"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowDeep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BB8E8"/><stop offset="100%" stop-color="#E5C99A"/>
    </linearGradient>
    <linearGradient id="wipeGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE06600" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#E6B800"/>
      <stop offset="100%" stop-color="#C9990A00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3A0"/>
      <stop offset="55%" stop-color="#FFD933"/>
      <stop offset="100%" stop-color="#C9990A"/>
    </linearGradient>
    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Game scene underneath, dimmed -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <path d="M0 700 L260 540 L460 620 L720 500 L960 600 L1240 520 L1520 620 L1740 540 L1920 600 L1920 1080 L0 1080 Z" fill="#7898AC" opacity="0.55"/>
  <path d="M0 780 L200 680 L420 760 L640 660 L880 740 L1140 670 L1380 760 L1640 680 L1920 720 L1920 1080 L0 1080 Z" fill="#5A7488"/>
  <rect y="820" width="1920" height="260" fill="#7BA850"/>
  <rect x="180" y="700" width="320" height="40" rx="6" fill="#8B5A2B"/>
  <rect x="1420" y="700" width="320" height="40" rx="6" fill="#8B5A2B"/>
  <rect x="800" y="620" width="320" height="40" rx="6" fill="#8B5A2B"/>

  <!-- Dim overlay -->
  <rect width="1920" height="1080" fill="rgba(0,0,0,0.45)"/>

  <!-- ==== DIAGONAL SWIPE WIPE BAND ==== -->
  <g transform="translate(960,540) rotate(-8) translate(-960,-540)">
    <rect x="-200" y="380" width="2320" height="320" fill="url(#wipeGold)"/>
    <rect x="-200" y="380" width="2320" height="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="-200" y="696" width="2320" height="4" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- ==== BIG ROUND NUMBER ==== -->
  <g transform="translate(960,540)" text-anchor="middle" filter="url(#titleShadow)">
    <!-- "ROUND" label -->
    <text y="-90" font-size="48" font-weight="700" fill="#FFFFFF" letter-spacing="20" filter="url(#glow)" opacity="0.95">ROUND</text>
    <!-- big 3 -->
    <text y="120" font-size="380" font-weight="900" fill="url(#goldTitle)" stroke="#3A2200" stroke-width="6" letter-spacing="-4">3</text>
    <!-- decorative arrow ornaments -->
    <g transform="translate(-260,30)" fill="none" stroke="#FFD933" stroke-width="3" opacity="0.8">
      <line x1="-100" y1="0" x2="40" y2="0"/>
      <polygon points="50,-8 70,0 50,8" fill="#FFD933" stroke="none"/>
    </g>
    <g transform="translate(260,30)" fill="none" stroke="#FFD933" stroke-width="3" opacity="0.8">
      <line x1="-40" y1="0" x2="100" y2="0"/>
      <polygon points="-50,-8 -70,0 -50,8" fill="#FFD933" stroke="none"/>
    </g>
  </g>

  <!-- ==== SUBTITLE ==== -->
  <g transform="translate(960,740)" text-anchor="middle">
    <text font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="8">SCORE  3 — 2</text>
    <text y="48" font-size="22" font-weight="500" fill="rgba(255,255,255,0.65)" letter-spacing="6">FIRST TO 5 WINS</text>
  </g>

  <!-- ==== STATE VARIANTS (small previews top-right) ==== -->
  <g transform="translate(1540,40)" font-family="'Inter',sans-serif">
    <text font-size="16" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="3">ROUND COLOR STATES</text>
    <!-- Round 1 (green) -->
    <g transform="translate(0,30)">
      <rect width="100" height="60" rx="10" fill="rgba(0,0,0,0.4)"/>
      <text x="50" y="20" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.55)">R 1-2</text>
      <text x="50" y="50" text-anchor="middle" font-size="32" font-weight="900" fill="#33B859">1</text>
    </g>
    <!-- Round 3 (gold) -->
    <g transform="translate(110,30)">
      <rect width="100" height="60" rx="10" fill="rgba(0,0,0,0.4)"/>
      <text x="50" y="20" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.55)">R 3</text>
      <text x="50" y="50" text-anchor="middle" font-size="32" font-weight="900" fill="#FFD933">3</text>
    </g>
    <!-- Round 5 (red final) -->
    <g transform="translate(220,30)">
      <rect width="100" height="60" rx="10" fill="rgba(0,0,0,0.4)"/>
      <text x="50" y="20" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.55)">R 5 FINAL</text>
      <text x="50" y="50" text-anchor="middle" font-size="32" font-weight="900" fill="#F23F3F">5</text>
    </g>
  </g>

  <text x="40" y="40" font-size="14" fill="rgba(255,255,255,0.45)">07 — ROUND TRANSITION · 1920×1080 · ~1.2s with swipe wipe</text>
</svg>

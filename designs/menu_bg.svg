<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/>
      <stop offset="55%" stop-color="#0F1A38"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#FFD933" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFD933" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#bgSky)"/>
  <ellipse cx="960" cy="370" rx="1040" ry="460" fill="url(#bgGlow)"/>

  <!-- Stars (far parallax layer) -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="160" cy="120" r="1.5"/><circle cx="280" cy="80" r="2"/><circle cx="440" cy="180" r="1"/>
    <circle cx="640" cy="60" r="1.5"/><circle cx="820" cy="140" r="2"/><circle cx="1000" cy="90" r="1"/>
    <circle cx="1180" cy="160" r="1.5"/><circle cx="1340" cy="70" r="2"/><circle cx="1520" cy="130" r="1"/>
    <circle cx="1680" cy="100" r="1.5"/><circle cx="1820" cy="180" r="2"/>
    <circle cx="220" cy="240" r="1"/><circle cx="900" cy="220" r="1"/><circle cx="1440" cy="240" r="1"/>
  </g>

  <!-- Distant mountains -->
  <path d="M0 720 L180 580 L320 660 L520 540 L720 640 L900 560 L1100 660 L1300 580 L1520 660 L1740 580 L1920 640 L1920 1080 L0 1080 Z" fill="#1A2440" opacity="0.85"/>
  <!-- Near mountains -->
  <path d="M0 820 L160 720 L380 800 L580 700 L820 790 L1060 720 L1280 800 L1480 720 L1720 790 L1920 740 L1920 1080 L0 1080 Z" fill="#0F1A2E"/>
  <!-- Ground -->
  <rect y="900" width="1920" height="180" fill="#080C1A"/>
  <rect y="900" width="1920" height="6" fill="#FFD933" opacity="0.15"/>
</svg>

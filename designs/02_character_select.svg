<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gPrimary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#1F73D9"/>
    </linearGradient>
    <linearGradient id="gSuccess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BD980"/>
      <stop offset="100%" stop-color="#258F44"/>
    </linearGradient>
    <linearGradient id="gDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="100%" stop-color="#D63232"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="goldTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3A0"/>
      <stop offset="55%" stop-color="#FFD933"/>
      <stop offset="100%" stop-color="#C9990A"/>
    </linearGradient>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252B45"/>
      <stop offset="100%" stop-color="#181D30"/>
    </linearGradient>
    <linearGradient id="gBgVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/>
      <stop offset="55%" stop-color="#0F1A38"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowDeep" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2552"/>
      <stop offset="100%" stop-color="#0A0E1C"/>
    </linearGradient>
    <linearGradient id="cardActive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3258"/>
      <stop offset="100%" stop-color="#161B30"/>
    </linearGradient>
    <linearGradient id="cardInactive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2038"/>
      <stop offset="100%" stop-color="#0F1421"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#gBgVert)"/>

  <!-- decorative grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
  </g>

  <!-- Top bar -->
  <g transform="translate(60,60)">
    <!-- back -->
    <g filter="url(#shadowDeep)">
      <circle r="40" cx="40" cy="40" fill="rgba(31,36,56,0.85)" stroke="rgba(255,255,255,0.15)"/>
      <path d="M50 25 L30 40 L50 55" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="960" y="110" text-anchor="middle" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="6">CHOOSE YOUR ARCHER</text>
  <text x="960" y="150" text-anchor="middle" font-size="22" font-weight="400" fill="rgba(255,255,255,0.55)" letter-spacing="6">Each archer plays differently — pick the one that suits you</text>

  <!-- Compact profile badge (top-right) -->
  <g transform="translate(1400,40)" filter="url(#shadowSoft)">
    <rect width="480" height="72" rx="20" fill="rgba(26,31,51,0.34)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <g transform="translate(36,36)">
      <circle r="20" fill="rgba(255,217,51,0.18)"/>
      <polygon points="0,-12 3.5,-4 12,-4 5,1 7.5,10 0,5 -7.5,10 -5,1 -12,-4 -3.5,-4" fill="#FFD933"/>
    </g>
    <text x="68" y="44" font-size="28" font-weight="800" fill="#FFFFFF">4</text>
    <line x1="128" y1="18" x2="128" y2="54" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="168" cy="36" r="16" fill="#FFD933"/>
    <circle cx="168" cy="36" r="10" fill="none" stroke="#1A1A1A" stroke-width="2" opacity="0.3"/>
    <text x="196" y="44" font-size="28" font-weight="800" fill="#FFFFFF">820</text>
    <line x1="308" y1="18" x2="308" y2="54" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <polygon points="348,24 364,36 356,52 340,52 332,36" fill="#6B8CFF" stroke="#FFFFFF" stroke-width="2"/>
    <text x="384" y="44" font-size="28" font-weight="800" fill="#FFFFFF">12</text>
  </g>

  <!-- ===== ADVENTURER CARD (selected) ===== -->
  <g transform="translate(220,220)">
    <g filter="url(#shadowDeep)">
      <rect width="660" height="700" rx="32" fill="url(#cardActive)" stroke="url(#goldStroke)" stroke-width="4"/>
      <!-- gold check badge top-right -->
      <g transform="translate(596,40)">
        <circle r="32" fill="url(#goldStroke)"/>
        <path d="M-14 0 L-4 10 L14 -8" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- character art -->
    <g transform="translate(330,330)">
      <!-- shadow -->
      <ellipse cx="0" cy="180" rx="120" ry="20" fill="#000000" opacity="0.5"/>
      <!-- body -->
      <rect x="-40" y="-30" width="80" height="120" rx="12" fill="#3A7A4D"/>
      <!-- belt -->
      <rect x="-44" y="70" width="88" height="14" rx="3" fill="#4A2E1A"/>
      <!-- pants -->
      <rect x="-40" y="90" width="36" height="90" rx="6" fill="#4A2E1A"/>
      <rect x="4" y="90" width="36" height="90" rx="6" fill="#4A2E1A"/>
      <!-- head -->
      <circle cx="0" cy="-90" r="56" fill="#F2C29B"/>
      <!-- hair -->
      <path d="M-50 -110 Q-46 -150 0 -154 Q46 -150 50 -110 L40 -94 Q34 -114 22 -118 L18 -100 L4 -118 L-12 -98 L-22 -118 Q-34 -114 -40 -94 Z" fill="#5A3A1F"/>
      <!-- eyes -->
      <circle cx="-15" cy="-95" r="4" fill="#1A1A1A"/>
      <circle cx="15" cy="-95" r="4" fill="#1A1A1A"/>
      <!-- mouth -->
      <path d="M-10 -70 Q0 -64 10 -70" fill="none" stroke="#5A3A1F" stroke-width="2.5" stroke-linecap="round"/>
      <!-- arms -->
      <rect x="-58" y="-10" width="22" height="60" rx="6" fill="#F2C29B"/>
      <rect x="36" y="-10" width="22" height="60" rx="6" fill="#F2C29B"/>
      <!-- bow -->
      <path d="M-110 -40 Q-160 30 -110 100" fill="none" stroke="#8B5A2B" stroke-width="8" stroke-linecap="round"/>
      <line x1="-110" y1="-40" x2="-110" y2="100" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    </g>

    <!-- name -->
    <text x="330" y="560" text-anchor="middle" font-size="58" font-weight="800" fill="#FFD933" letter-spacing="3">ADVENTURER</text>
    <text x="330" y="600" text-anchor="middle" font-size="22" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="4">QUICK · NIMBLE · LIGHT</text>

    <!-- stats -->
    <g transform="translate(80,630)">
      <text font-size="18" fill="rgba(255,255,255,0.55)">SPEED</text>
      <rect x="100" y="-14" width="280" height="16" rx="8" fill="#0F1421"/>
      <rect x="100" y="-14" width="240" height="16" rx="8" fill="url(#gGold)"/>
      <text x="392" font-size="18" fill="rgba(255,255,255,0.7)">9 / 10</text>
    </g>
    <g transform="translate(80,668)">
      <text font-size="18" fill="rgba(255,255,255,0.55)">POWER</text>
      <rect x="100" y="-14" width="280" height="16" rx="8" fill="#0F1421"/>
      <rect x="100" y="-14" width="170" height="16" rx="8" fill="url(#gSuccess)"/>
      <text x="392" font-size="18" fill="rgba(255,255,255,0.7)">6 / 10</text>
    </g>
  </g>

  <!-- ===== VS divider ===== -->
  <g transform="translate(960,560)" text-anchor="middle" filter="url(#shadowSoft)">
    <circle r="60" fill="#0F1421" stroke="url(#gGold)" stroke-width="4"/>
    <text y="20" font-size="56" font-weight="900" fill="url(#goldTitle)">VS</text>
  </g>

  <!-- ===== SOLDIER CARD (not selected) ===== -->
  <g transform="translate(1040,220)">
    <g filter="url(#shadowDeep)">
      <rect width="660" height="700" rx="32" fill="url(#cardInactive)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    </g>

    <!-- character art -->
    <g transform="translate(330,330)" opacity="0.85">
      <ellipse cx="0" cy="180" rx="120" ry="20" fill="#000000" opacity="0.5"/>
      <!-- body (blue shirt) -->
      <rect x="-40" y="-30" width="80" height="120" rx="12" fill="#2E5BAA"/>
      <!-- belt -->
      <rect x="-44" y="70" width="88" height="14" rx="3" fill="#4A2E1A"/>
      <!-- pants -->
      <rect x="-40" y="90" width="36" height="90" rx="6" fill="#4A2E1A"/>
      <rect x="4" y="90" width="36" height="90" rx="6" fill="#4A2E1A"/>
      <!-- head -->
      <circle cx="0" cy="-90" r="56" fill="#F2C29B"/>
      <!-- helmet -->
      <path d="M-56 -100 Q-58 -154 0 -158 Q58 -154 56 -100 Z" fill="#C9A55E"/>
      <rect x="-58" y="-110" width="116" height="14" rx="3" fill="#A0823F"/>
      <!-- eyes -->
      <circle cx="-15" cy="-90" r="4" fill="#1A1A1A"/>
      <circle cx="15" cy="-90" r="4" fill="#1A1A1A"/>
      <!-- mouth -->
      <path d="M-10 -65 Q0 -59 10 -65" fill="none" stroke="#5A3A1F" stroke-width="2.5" stroke-linecap="round"/>
      <!-- arms -->
      <rect x="-58" y="-10" width="22" height="60" rx="6" fill="#F2C29B"/>
      <rect x="36" y="-10" width="22" height="60" rx="6" fill="#F2C29B"/>
      <!-- bow -->
      <path d="M110 -40 Q160 30 110 100" fill="none" stroke="#8B5A2B" stroke-width="8" stroke-linecap="round"/>
      <line x1="110" y1="-40" x2="110" y2="100" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    </g>

    <text x="330" y="560" text-anchor="middle" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="3" opacity="0.85">SOLDIER</text>
    <text x="330" y="600" text-anchor="middle" font-size="22" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="4">STURDY · DEFENSIVE · TANKY</text>

    <g transform="translate(80,630)" opacity="0.85">
      <text font-size="18" fill="rgba(255,255,255,0.55)">SPEED</text>
      <rect x="100" y="-14" width="280" height="16" rx="8" fill="#0F1421"/>
      <rect x="100" y="-14" width="140" height="16" rx="8" fill="#FFD933" opacity="0.7"/>
      <text x="392" font-size="18" fill="rgba(255,255,255,0.7)">5 / 10</text>
    </g>
    <g transform="translate(80,668)" opacity="0.85">
      <text font-size="18" fill="rgba(255,255,255,0.55)">POWER</text>
      <rect x="100" y="-14" width="280" height="16" rx="8" fill="#0F1421"/>
      <rect x="100" y="-14" width="250" height="16" rx="8" fill="#33B859" opacity="0.9"/>
      <text x="392" font-size="18" fill="rgba(255,255,255,0.7)">9 / 10</text>
    </g>

    <!-- LOCK overlay — requires level + coins -->
    <g transform="translate(0,0)">
      <rect width="660" height="700" rx="32" fill="rgba(10,14,28,0.72)"/>
      <g transform="translate(330,300)" text-anchor="middle">
        <circle r="56" fill="rgba(31,36,56,0.9)" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
        <rect x="-18" y="-10" width="36" height="28" rx="6" fill="none" stroke="#FFFFFF" stroke-width="5"/>
        <path d="M-18 -10 L-18 -22 Q-18 -34 0 -34 Q18 -34 18 -22 L18 -10" fill="none" stroke="#FFFFFF" stroke-width="5"/>
        <text y="100" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="3">LOCKED</text>
        <text y="140" font-size="22" font-weight="600" fill="rgba(255,255,255,0.6)">REQUIRES LV 5</text>
        <g transform="translate(0,190)">
          <rect x="-120" y="-24" width="240" height="48" rx="24" fill="rgba(255,217,51,0.15)" stroke="#FFD933" stroke-width="2"/>
          <circle cx="-70" cy="0" r="12" fill="#FFD933"/>
          <text x="-48" y="8" font-size="24" font-weight="800" fill="#FFD933">500 COINS</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== CONFIRM BUTTON ===== -->
  <g transform="translate(680,970)" filter="url(#shadowSoft)">
    <rect width="560" height="80" rx="40" fill="url(#gPrimary)"/>
    <rect x="8" y="8" width="544" height="20" rx="10" fill="#FFFFFF" opacity="0.15"/>
    <g transform="translate(48,40)" fill="#FFFFFF">
      <path d="M-8 -14 L-8 14 L14 0 Z"/>
    </g>
    <text x="300" y="52" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="4">CONFIRM SELECTION</text>
  </g>

  <text x="40" y="40" font-size="14" fill="rgba(255,255,255,0.25)">02 — CHARACTER SELECT · 1920×1080 landscape</text>
</svg>
